name: Tests

on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu-latest bringt Docker mit: die Integrationstests starten SQL Server per Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BudoShuren.sln

      - name: Build
        run: dotnet build BudoShuren.sln --no-restore -c Release

      - name: Tests (inkl. Integrationstests)
        run: dotnet test --solution BudoShuren.sln --no-build -c Release
